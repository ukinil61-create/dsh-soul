<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DSH Soul Tab</title>
<style>
  /* 窗口是黑底的，和纯黑壁纸连在一起，看起来只有这个圆角的小块 */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  button {
    display: block; width: 100%; height: 100%; padding: 0; background: #14161f; border: 1px solid #2a2e3d; border-radius: 6px 0 0 6px;
    color: #8b90a3; font: 16px/1 "Microsoft YaHei UI", sans-serif; cursor: pointer; outline: 0;
  }
  button:hover { background: #20232e; color: #e8eaf2; }
  body.open button { border-radius: 6px 0 0 6px; }
</style>
</head>
<body>
<button id="toggle" title="展开会话" aria-label="展开会话">‹</button>
<script>
  const button = document.getElementById('toggle');
  button.addEventListener('click', () => window.soulHost.toggleDrawer());
  window.soulHost.onEvent((event) => {
    if (event.kind !== 'drawer') return;
    button.textContent = event.open ? '›' : '‹';
    button.title = event.open ? '收回会话' : '展开会话';
    button.setAttribute('aria-label', button.title);
  });
</script>
</body>
</html>
