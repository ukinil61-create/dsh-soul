<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<title>光点形象工作室</title>
<style>
  /* 布局：左边选形象，中间是舞台，右边改图层。全页深色，和它住的黑色桌面一致 */
  :root {
    color-scheme: dark;
    --bg: #07080c; --panel: #0e1017; --soft: #171a24; --line: #242835; --ink: #e8eaf2; --dim: #8b90a3;
    --glow: #a9b8ff; --red: #ff9b9b;
    --ui: "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--ui); }
  #app {
    display: grid; grid-template-columns: 250px minmax(0, 1fr) 300px; gap: 0; height: 100vh; min-height: 560px;
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  }
  aside { min-width: 0; overflow-y: auto; background: var(--panel); padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  #left { border-right: 1px solid var(--line); }
  #right { border-left: 1px solid var(--line); }
  h1 { margin: 0; font-size: 16px; font-weight: 600; }
  h2 { margin: 0 0 6px; font-size: 12px; font-weight: 500; color: var(--dim); }
  button, input, select, textarea { font: inherit; color: var(--ink); }
  .btn { padding: 5px 10px; background: var(--soft); border: 1px solid var(--line); border-radius: 5px; cursor: pointer; }
  .btn:hover { border-color: var(--glow); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--glow); border-color: var(--glow); color: #0a0c14; font-weight: 500; }
  :focus-visible { outline: 2px solid var(--glow); outline-offset: 1px; }
  .choice {
    display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; width: 100%; padding: 6px; text-align: left;
    background: none; border: 1px solid transparent; border-radius: 6px; cursor: pointer; align-items: center;
  }
  .choice:hover { background: var(--soft); }
  .choice.on { border-color: var(--glow); background: var(--soft); }
  .choice canvas { width: 58px; height: 76px; background: #000; border-radius: 4px; display: block; }
  .choice strong { display: block; font-weight: 500; }
  .choice small { display: block; color: var(--dim); font-size: 12px; line-height: 1.4; }
  .choice .using { color: var(--glow); font-size: 12px; }
  .choices { display: flex; flex-direction: column; gap: 4px; }
  main { position: relative; min-width: 0; background: #000; overflow: hidden; }
  #stage, #handles { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* 控制点平时藏着，看形象时不挡视线 */
  #handles { touch-action: none; opacity: 0; transition: opacity .2s ease; }
  main:hover #handles, #handles:focus-visible { opacity: 1; }
  @media (hover: none) { #handles { opacity: 1; } }
  #reference { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; display: none; }
  #bar { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #bar .label { color: var(--dim); font-size: 12px; margin-right: 2px; }
  .state.on { border-color: var(--glow); color: var(--glow); }
  #tip { position: absolute; left: 12px; top: 10px; right: 12px; color: var(--dim); font-size: 12px; pointer-events: none; }
  .layer { display: flex; align-items: center; gap: 6px; width: 100%; padding: 4px 6px; background: none; border: 1px solid transparent; border-radius: 4px; text-align: left; cursor: pointer; }
  .layer:hover { background: var(--soft); }
  .layer.on { border-color: var(--line); background: var(--soft); }
  .layer i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .layer span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .layer.off span { color: var(--dim); text-decoration: line-through; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .field { display: grid; grid-template-columns: 62px minmax(0, 1fr) 42px; gap: 8px; align-items: center; padding: 3px 0; font-size: 13px; }
  .field output { color: var(--dim); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  .field input[type="range"] { width: 100%; min-width: 0; accent-color: var(--glow); }
  .check { display: flex; gap: 8px; align-items: center; padding: 3px 0; font-size: 13px; }
  input[type="text"], textarea { width: 100%; padding: 5px 8px; background: var(--soft); border: 1px solid var(--line); border-radius: 4px; outline: 0; }
  input[type="text"]:focus, textarea:focus { border-color: var(--glow); }
  textarea { height: 90px; resize: vertical; font: 12px/1.4 Consolas, monospace; }
  #count { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  #count.over { color: var(--red); }
  #message { min-height: 1.4em; color: var(--glow); font-size: 12px; }
  [hidden] { display: none !important; }
  @media (max-width: 900px) {
    #app { grid-template-columns: minmax(0, 1fr); height: auto; min-height: 0; }
    main { height: 70vh; order: -1; }
    #left, #right { border: 0; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>

<div id="app">
  <aside id="left">
    <h1>光点形象工作室</h1>
    <div id="webNote" hidden>
      <small style="color:var(--dim)">这是网页预览。看中哪个告诉 Claude 名字就行。这里改的只存在这个浏览器里，要用在桌面得到桌面的工作室。</small>
    </div>
    <div>
      <h2>内置方案</h2>
      <div id="presets" class="choices"></div>
    </div>
    <div>
      <h2>我的设计</h2>
      <div id="saved" class="choices"></div>
      <small id="savedEmpty" style="color:var(--dim)">还没有。改完右边点“存成我的设计”。</small>
    </div>
  </aside>

  <main>
    <canvas id="stage" aria-label="形象预览"></canvas>
    <img id="reference" alt="">
    <canvas id="handles" aria-hidden="true"></canvas>
    <div id="tip">鼠标移到这里会出现控制点：拖动改走向，双击线条加点，右键删点。</div>
    <div id="bar">
      <span class="label">预览状态</span>
      <button class="btn state" data-state="linger">形象</button>
      <button class="btn state" data-state="speak">说话</button>
      <button class="btn state" data-state="idle">待机</button>
      <button class="btn state" data-state="listen">听</button>
      <button class="btn state" data-state="think">想</button>
      <button class="btn state" data-state="work">干活</button>
      <button class="btn state" data-state="done">做完</button>
    </div>
  </main>

  <aside id="right">
    <div>
      <h2>这个形象</h2>
      <input type="text" id="figureName" aria-label="形象名字" spellcheck="false">
      <div id="useRow" class="row" style="margin-top:8px">
        <button id="useBtn" class="btn primary">用在桌面</button>
        <button id="saveBtn" class="btn">存成我的设计</button>
        <button id="deleteBtn" class="btn" hidden>删除</button>
      </div>
      <div id="message" role="status"></div>
      <div class="field"><span>大小</span><input type="range" id="figHeight" min=".3" max=".85" step=".01"><output id="figHeightOut"></output></div>
      <div class="field"><span>状态染色</span><input type="range" id="figTint" min="0" max="1" step=".01"><output id="figTintOut"></output></div>
    </div>

    <div>
      <h2>图层 <span id="count"></span></h2>
      <div id="layers"></div>
      <div class="row" style="margin-top:6px">
        <button class="btn addLayer" data-kind="curve">+ 线条</button>
        <button class="btn addLayer" data-kind="orb">+ 光团</button>
        <button class="btn addLayer" data-kind="eye">+ 眼睛</button>
        <button class="btn addLayer" data-kind="stars">+ 星点</button>
      </div>
    </div>

    <div id="inspector" hidden>
      <h2>选中的图层</h2>
      <input type="text" id="layerName" aria-label="图层名字" spellcheck="false">
      <div class="field"><span>颜色</span><input type="color" id="layerColor" aria-label="颜色"><output></output></div>
      <div class="field"><span>光点数</span><input type="range" id="layerCount" min="10" max="2000" step="10"><output id="layerCountOut"></output></div>
      <div class="field"><span>粗细</span><input type="range" id="layerWidth" min=".001" max=".5" step=".001"><output id="layerWidthOut"></output></div>
      <div class="field"><span>亮度</span><input type="range" id="layerBrightness" min=".05" max="1" step=".01"><output id="layerBrightnessOut"></output></div>
      <div class="field"><span>闪烁</span><input type="range" id="layerTwinkle" min="0" max="1" step=".01"><output id="layerTwinkleOut"></output></div>
      <div class="field" id="flowRow"><span>流动</span><input type="range" id="layerFlow" min="-.3" max=".3" step=".005"><output id="layerFlowOut"></output></div>
      <div class="field" id="swayRow"><span>飘动</span><input type="range" id="layerSway" min="0" max=".05" step=".001"><output id="layerSwayOut"></output></div>
      <label class="check"><input type="checkbox" id="layerMirror"> 左右对称</label>
      <label class="check" id="closedRow"><input type="checkbox" id="layerClosed"> 首尾相连</label>
      <label class="check"><input type="checkbox" id="layerGlow"> 辉光</label>
      <label class="check" id="mouthRow"><input type="checkbox" id="layerMouth"> 说话时会动（嘴）</label>
      <div class="row" style="margin-top:6px">
        <button id="layerUp" class="btn">上移</button>
        <button id="layerHide" class="btn">隐藏</button>
        <button id="layerCopy" class="btn">复制</button>
        <button id="layerRemove" class="btn">删除</button>
      </div>
    </div>

    <div>
      <h2>更多</h2>
      <div class="row">
        <button id="undoBtn" class="btn">撤销</button>
        <button id="refBtn" class="btn">描图参考</button>
        <input type="file" id="refFile" accept="image/*" hidden>
        <button id="exportBtn" class="btn">导出</button>
        <button id="importBtn" class="btn">导入</button>
      </div>
      <div class="field" id="refRow" hidden><span>参考透明</span><input type="range" id="refOpacity" min="0" max="1" step=".01" value=".35"><output></output></div>
      <textarea id="ioBox" hidden aria-label="形象数据" spellcheck="false"></textarea>
    </div>
  </aside>
</div>

<script src="figure-engine.js"></script>
<script src="figure-presets.js"></script>
<script src="light.js"></script>
<script src="studio.js"></script>
