<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DSH Soul Panel</title>
<style>
  :root {
    --bg: #0d0e14; --side: #0a0b10; --line: #23262f; --ink: #e8eaf2; --dim: #8b90a3; --soft: #171922;
    --glow: #a9b8ff; --amber: #ffba68; --red: #ff9b9b; --green: #8fe8b8;
    --ui: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; --mono: Consolas, "Microsoft YaHei UI", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 14px/1.6 var(--ui); }
  #app { display: grid; grid-template-columns: 250px minmax(0, 1fr); height: 100%; border: 1px solid var(--line); }
  #app.official { grid-template-columns: minmax(0, 1fr); }
  #app.official aside { display: none; }
  aside { display: flex; flex-direction: column; min-height: 0; background: var(--side); border-right: 1px solid var(--line); }
  #sideHead { display: flex; gap: 8px; padding: 12px; }
  #search { flex: 1; min-width: 0; padding: 6px 10px; background: var(--soft); border: 1px solid var(--line); border-radius: 5px; color: var(--ink); font: inherit; outline: 0; }
  #search:focus { border-color: var(--glow); }
  #newBtn { padding: 0 10px; }
  #list { flex: 1; overflow-y: auto; padding: 0 6px 10px; }
  .group { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin: 12px 8px 4px; font-size: 12px; color: var(--dim); }
  .group span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .groupAdd { flex: none; width: 18px; height: 18px; padding: 0; line-height: 16px; background: none; border: 0; border-radius: 3px; color: var(--dim); font: inherit; cursor: pointer; visibility: hidden; }
  .group:hover .groupAdd, .groupAdd:focus-visible { visibility: visible; }
  .groupAdd:hover { color: var(--ink); background: var(--soft); }
  .row { display: flex; align-items: center; gap: 6px; width: 100%; padding: 6px 8px; background: none; border: 0; border-radius: 5px; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  .row:hover { background: var(--soft); }
  .row.on { background: #20232e; }
  .row span:first-child { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.main { color: var(--glow); }
  /* 鼠标移到这一行上才出现 */
  .rowArchive { flex: none; padding: 0 6px; border-radius: 3px; color: var(--dim); font-size: 12px; visibility: hidden; }
  .row:hover .rowArchive { visibility: visible; }
  .rowArchive:hover { color: var(--ink); background: var(--soft); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); flex: none; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #head { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); user-select: none; }
  /* 窗口的四条边，看不见，鼠标移上去才变样 */
  .grab { position: fixed; z-index: 6; touch-action: none; }
  #grab-left, #grab-right { top: 0; bottom: 0; width: 5px; cursor: ew-resize; }
  #grab-top, #grab-bottom { left: 0; right: 0; height: 5px; cursor: ns-resize; }
  #grab-left { left: 0; }
  #grab-right { right: 0; }
  #grab-top { top: 0; }
  #grab-bottom { bottom: 0; }
  #title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  #cwd { color: var(--dim); font-size: 12px; max-width: 40%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn { background: var(--soft); border: 1px solid var(--line); border-radius: 5px; color: var(--ink); font: inherit; cursor: pointer; }
  .btn:hover { border-color: var(--glow); }
  #close { width: 28px; height: 26px; padding: 0; }
  #log { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
  #more { align-self: center; padding: 2px 12px; color: var(--dim); }
  .msg { max-width: 100%; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; max-width: 80%; padding: 6px 12px; background: #262a3a; border-radius: 8px; white-space: pre-wrap; }
  .msg.assistant p { margin: 0 0 .6em; white-space: pre-wrap; }
  .msg.assistant p:last-child { margin-bottom: 0; }
  .msg.assistant pre, .diff { margin: 6px 0; padding: 8px 10px; background: #06070b; border-radius: 4px; font: 13px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.assistant code { font-family: var(--mono); background: #1c1f2a; padding: 0 4px; border-radius: 3px; }
  .tool { font: 12.5px/1.5 var(--mono); color: var(--dim); overflow-wrap: anywhere; }
  .tool.running { color: var(--amber); }
  .tool.failed { color: var(--red); }
  .diff .del { color: var(--red); display: block; }
  .diff .add { color: var(--green); display: block; }
  .approval { padding: 10px 12px; border: 1px solid var(--amber); border-radius: 6px; }
  .approval div { display: flex; gap: 8px; margin-top: 8px; }
  .approval button { padding: 3px 14px; }
  .notice { color: var(--red); }
  #composer { display: flex; align-items: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  #input { flex: 1; min-height: 38px; max-height: 180px; padding: 8px 10px; resize: none; background: var(--soft); border: 1px solid var(--line); border-radius: 6px; color: var(--ink); font: inherit; outline: 0; }
  #input:focus { border-color: var(--glow); }
  #send { height: 38px; padding: 0 16px; }
  #stop { height: 38px; padding: 0 12px; color: var(--amber); }
  #empty { margin: auto; color: var(--dim); }
  .quiet { background: none; border: 0; color: var(--dim); font: inherit; font-size: 12px; cursor: pointer; padding: 2px 6px; border-radius: 4px; text-align: left; }
  .quiet:hover { color: var(--ink); }
  #settingsBtn { margin: 4px 8px 10px; align-self: flex-start; }
  #meta { display: flex; gap: 6px; padding: 0 16px 8px; margin-top: -6px; min-height: 22px; }
  #pop {
    position: fixed; left: 266px; right: 32px; bottom: 96px; max-height: 300px; overflow-y: auto; z-index: 5; padding: 4px;
    background: #14161f; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
  }
  #pop.anchor-side { left: 8px; right: auto; width: 234px; bottom: auto; }
  .opt { display: block; width: 100%; padding: 5px 8px; background: none; border: 0; border-radius: 4px; color: var(--ink); font: inherit; text-align: left; cursor: pointer; overflow-wrap: anywhere; }
  .opt small { display: block; color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opt:hover, .opt.on { background: #20232e; }
  .opt.chosen { color: var(--glow); }
  .popHead { padding: 6px 8px 2px; color: var(--dim); font-size: 12px; }
  #pop input { width: 100%; padding: 6px 8px; background: var(--soft); border: 1px solid var(--line); border-radius: 4px; color: var(--ink); font: inherit; outline: 0; }
  .question { padding: 10px 12px; border: 1px solid var(--glow); border-radius: 6px; display: flex; flex-direction: column; gap: 8px; }
  .question .choices { display: flex; flex-wrap: wrap; gap: 6px; }
  .question .choice { padding: 3px 12px; }
  .question .choice.picked { border-color: var(--glow); color: var(--glow); }
  .question input { padding: 5px 8px; background: var(--soft); border: 1px solid var(--line); border-radius: 4px; color: var(--ink); font: inherit; outline: 0; }
  .question .submit { align-self: flex-start; padding: 3px 16px; }
  #settings { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 24px; display: flex; flex-direction: column; gap: 20px; }
  .section h3 { margin: 0 0 8px; font-size: 13px; font-weight: 500; color: var(--dim); }
  .field { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 10px; align-items: center; padding: 5px 0; }
  .field input[type="text"], .field input:not([type]), .field select { width: 100%; padding: 5px 8px; background: var(--soft); border: 1px solid var(--line); border-radius: 4px; color: var(--ink); font: inherit; outline: 0; }
  .field input:focus, .field select:focus { border-color: var(--glow); }
  .field input[type="checkbox"] { justify-self: start; }
  .field .error { grid-column: 2; color: var(--red); font-size: 12px; }
  .field .hint { grid-column: 2; color: var(--dim); font-size: 12px; }
  .link { padding: 6px 12px; }
  #context { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 20px; display: flex; flex-direction: column; gap: 12px; }
  .ctx-summary { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 2px 10px; font-size: 12.5px; }
  .ctx-summary span:nth-child(odd) { color: var(--dim); }
  .ctx-summary span { overflow-wrap: anywhere; }
  .ctx-tools { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--dim); }
  .ctx-tools input:not([type]) { flex: 1; min-width: 0; padding: 5px 8px; background: var(--soft); border: 1px solid var(--line); border-radius: 4px; color: var(--ink); font: inherit; outline: 0; }
  .ctx-tools .btn { padding: 4px 10px; flex: none; }
  .ctx-tools label { display: flex; align-items: center; gap: 4px; flex: none; }
  .ctx-note { flex: none; }
  .ctx-list { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
  .ctx-row summary { display: flex; gap: 10px; padding: 3px 6px; border-radius: 4px; cursor: pointer; list-style: none; }
  .ctx-row summary::-webkit-details-marker { display: none; }
  .ctx-row summary:hover { background: var(--soft); }
  .ctx-row b { flex: none; font-weight: 500; }
  .ctx-row summary span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
  .ctx-row summary i { flex: none; font-style: normal; font-size: 12px; color: var(--dim); }
  .ctx-row pre { margin: 2px 0 8px 6px; padding: 8px 10px; background: #06070b; border-radius: 4px; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .ctx-inline { display: flex; gap: 10px; padding: 1px 6px; font-size: 12px; color: var(--dim); }
  .ctx-system b { color: var(--glow); }
  .ctx-user b { color: var(--green); }
  .ctx-assistant b { color: var(--ink); }
  .ctx-thinking b { color: #c9b8ff; }
  .ctx-tool b { color: var(--amber); }
  .ctx-failed b { color: var(--red); }
  .ctx-internal b, .ctx-usage b { color: var(--dim); font-weight: 400; }
  .ctx-compact b { color: var(--amber); }
  /* 已经被压缩替换的内容：记录还在，但模型现在看不到 */
  .ctx-gone { opacity: .45; }
  .ctx-gone summary b::after { content: "（已压缩）"; font-weight: 400; color: var(--dim); }
  .section .row-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  [hidden] { display: none !important; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #2a2d38; border-radius: 4px; }
  :focus-visible { outline: 1px solid var(--glow); }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div id="sideHead">
      <input id="search" placeholder="搜索会话" spellcheck="false" aria-label="搜索会话">
      <button id="newBtn" class="btn" title="选一个文件夹新建会话">新建</button>
    </div>
    <div id="list"></div>
    <button id="settingsBtn" class="quiet">设置和更多</button>
  </aside>
  <main>
    <div id="head">
      <button id="back" class="quiet" hidden>返回</button>
      <div id="title"></div>
      <div id="cwd"></div>
      <button id="close" class="btn" title="收起（Esc）" aria-label="收起">×</button>
    </div>
    <div id="log"></div>
    <div id="pop" hidden></div>
    <div id="composer">
      <textarea id="input" rows="1" spellcheck="false" placeholder="回车发送，Shift+回车换行。文件可以拖进来" aria-label="输入"></textarea>
      <button id="stop" class="btn" hidden>停止</button>
      <button id="send" class="btn">发送</button>
    </div>
    <div id="meta"><button id="modelChip" class="quiet"></button><button id="contextBtn" class="quiet">完整上下文</button></div>
    <div id="settings" hidden></div>
    <div id="context" hidden></div>
  </main>
</div>
<div id="grab-left" class="grab"></div>
<div id="grab-right" class="grab"></div>
<div id="grab-top" class="grab"></div>
<div id="grab-bottom" class="grab"></div>
<script src="context-view.js"></script>
<script src="panel.js"></script>
</body>
</html>
